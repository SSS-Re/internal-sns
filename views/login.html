<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社内SNS - ログイン</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; width: 100%; max-width: 360px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; }
    input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; border: none; background: #0284c7; color: white; font-weight: bold; cursor: pointer; }
    .switch { text-align: center; margin-top: 12px; font-size: 0.9em; }
    .switch a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>社内SNS ログイン</h2>
    <form action="/login" method="POST">
      <input type="text" name="username" placeholder="ユーザー名" required>
      <input type="password" name="password" placeholder="パスワード" required>
      <button type="submit">ログイン</button>
    </form>

    <hr style="border-color: #334155; margin: 20px 0;">

    <h2>新規登録</h2>
    <form hx-post="/register" hx-target="#reg-message">
      <input type="text" name="username" placeholder="希望のユーザー名" required>
      <input type="password" name="password" placeholder="パスワード" required>
      <button type="submit" style="background: #16a34a;">アカウント作成</button>
    </form>
    <div id="reg-message" style="margin-top: 10px; text-align: center;"></div>
  </div>
</body>
</html>
