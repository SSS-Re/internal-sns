<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社内SNS (HTMX Dark Mode)</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <!-- PWA対応メタタグ -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3090/3090425.png">

  <!-- Service Workerの登録 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary-color: #38bdf8;
      --primary-hover: #0284c7;
      --danger-color: #f43f5e;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .layout {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 20px;
    }

    .sidebar {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      height: fit-content;
    }

    .channel-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .channel-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-bottom: 4px;
      transition: all 0.2s;
    }

    .channel-btn:hover, .channel-btn.active {
      background-color: #0f172a;
      color: var(--primary-color);
      font-weight: 600;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .card h3 { margin: 0 0 16px 0; font-size: 1.1rem; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }

    input[type="text"], textarea {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--primary-color); }
    textarea { height: 80px; resize: vertical; }

    button.btn-primary {
      background-color: var(--primary-color);
      color: #0f172a;
      font-weight: 600;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    button.btn-primary:hover { background-color: var(--primary-hover); color: #fff; }
    .htmx-swapping { opacity: 0; transform: translateY(-10px); transition: all 0.3s ease-out; }

    /* スマホ向けレスポンシブ対応 */
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }
      .layout {
        grid-template-columns: 1fr; /* 縦並びに変更 */
        gap: 12px;
      }
      .sidebar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .channel-title {
        width: 100%;
        margin-bottom: 4px;
      }
      .channel-btn {
        width: auto;
        flex: 1;
        text-align: center;
        margin-bottom: 0;
        padding: 10px;
      }
      input[type="text"], textarea {
        font-size: 16px; /* iOSでズームされるのを防止 */
      }
    }
  </style>
</head>
<body>

  <h1>社内SNS ワークスペース</h1>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; background: #1e293b; padding: 12px; border-radius: 8px;">
      <span>ログイン中: <strong><span id="current-user">ユーザー</span></strong></span>
      <a href="/logout" style="color: #f87171; text-decoration: none; font-size: 0.9em;">ログアウト</a>
    </div>

  <div class="layout">
    <!-- サイドバー：チャンネル選択 -->
    <div class="sidebar">
      <div class="channel-title">チャンネル</div>
      
      <!-- hx-get で該当チャンネルのタイムラインのみを取得 -->
      <button class="channel-btn active" 
              hx-get="/posts?channel=General" 
              hx-target="#timeline" 
              onclick="updateChannelState('General', this)">
        # General
      </button>

      <button class="channel-btn" 
              hx-get="/posts?channel=e-Learning" 
              hx-target="#timeline" 
              onclick="updateChannelState('e-Learning', this)">
        # e-Learning
      </button>

      <button class="channel-btn" 
              hx-get="/posts?channel=月締め処理" 
              hx-target="#timeline" 
              onclick="updateChannelState('月締め処理', this)">
        # 月締め処理
      </button>
    </div>

    <!-- メインエリア -->
    <div class="main-content">
      <!-- 投稿フォーム -->
      <div class="card">
        <form hx-post="/posts" 
              hx-target="#timeline" 
              hx-swap="innerHTML" 
              hx-include="[name='channel']"
              hx-on::after-request="this.querySelector('textarea').value=''">
          
          <input type="hidden" id="channel-input" name="channel" value="General">
          
          <div>
            <label>投稿者名</label>
            <input type="text" name="user" value="自分">
          </div>
          <div style="margin-top: 14px;">
            <label>メッセージ (<span id="current-channel-label" style="color: var(--primary-color);">#General</span> へ投稿)</label>
            <textarea name="content" placeholder="投稿内容を入力..." required></textarea>
          </div>
          <div style="margin-top: 14px; text-align: right;">
            <button type="submit" class="btn-primary">投稿する</button>
          </div>
        </form>
      </div>

      <!-- タイムラインエリア -->
      <div class="card">
        <h3>タイムライン</h3>
        <div id="timeline" hx-get="/posts?channel=General" hx-trigger="load">
          <p style="color: var(--text-muted); text-align: center; padding: 20px 0;">読み込み中...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 見た目のボタンアクティブ化と隠しフォームの更新のみを極小のJSで行う
    function updateChannelState(name, el) {
      document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('channel-input').value = name;
      document.getElementById('current-channel-label').textContent = '#' + name;
    }
  </script>

</body>
</html>
